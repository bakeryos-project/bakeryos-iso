#!/usr/bin/nft -f

# BakeryOS desktop firewall.
# Uses a dedicated table so container/VM tooling keeps its own rules.
table inet bakeryos {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        iif "lo" accept

        # ICMP + ICMPv6 (neighbour discovery / router advertisements)
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # DHCP client (v4 broadcast reply, v6 multicast)
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # mDNS / Avahi: printer and file-share discovery, KDE Connect
        udp dport 5353 accept

        # KDE Connect / GSConnect
        tcp dport 1716 accept
        udp dport 1716 accept

        # Uncomment to allow inbound SSH
        # tcp dport 22 accept
        # Uncomment to share printers via CUPS
        # tcp dport 631 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
