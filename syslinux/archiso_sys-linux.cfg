LABEL arch
TEXT HELP
Boot the BakeryOS install medium on BIOS.
It allows you to install BakeryOS or perform system maintenance.
ENDTEXT
MENU LABEL BakeryOS install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the BakeryOS install medium on BIOS with speakup screen reader.
It allows you to install BakeryOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL BakeryOS install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
