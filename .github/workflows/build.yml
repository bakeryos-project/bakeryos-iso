name: BakeryOS Linux CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 */2 * *"
jobs:
  build-on-arch:
    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Pacman keyring and update system
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syyu --noconfirm

      - name: Install Python and essential tools
        run: |
          pacman -Sy --noconfirm git base-devel squashfs-tools dosfstools mtools arch-install-scripts xorriso wget

      - name: Verify Environment
        run: |
          uname -a
          cat /etc/arch-release
          gcc --version

      - name: Prepare
        run: |
          bash ./scripts/prepare.sh

      - name: Build
        run: |
          bash ./scripts/build.sh
