title   BakeryOS install medium (%ARCH%, UEFI) debug
sort-key 04
linux   /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd  /%INSTALL_DIR%/boot/intel-ucode.img
initrd  /%INSTALL_DIR%/boot/amd-ucode.img
initrd  /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n loglevel=7 systemd.log_level=debug systemd.log_target=console systemd.show_status=1 plymouth.enable=0
